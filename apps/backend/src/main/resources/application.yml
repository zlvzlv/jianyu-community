server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: jianyu-backend

  # ── 本周演示用：H2 内存库（PostgreSQL 兼容模式），启动即建表 + 灌演示账号 ──
  # 包 1 骨架落地后，本段整体替换为 application-dev-local.yml（PostgreSQL + Redis），
  # 并把 flyway.locations 中的 db/demo 去掉。
  datasource:
    url: jdbc:h2:mem:jianyu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # 数据库表结构只走 Flyway：db/migration 是正式脚本，db/demo 仅演示账号数据
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo
    baseline-on-migrate: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    time-zone: Asia/Shanghai

logging:
  level:
    com.community: INFO
