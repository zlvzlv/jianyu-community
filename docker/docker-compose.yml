services:
  postgres:
    image: postgres:16
    container_name: jianyu-pg
    environment:
      POSTGRES_DB: jianyu
      POSTGRES_USER: jianyu
      POSTGRES_PASSWORD: jianyu123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: jianyu-redis
    ports:
      - "6379:6379"
volumes:
  pgdata: